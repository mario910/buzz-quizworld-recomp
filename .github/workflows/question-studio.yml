name: Question Studio
on:
  push:
    paths: ['studio/**', 'scripts/build-question-studio.ps1', '.github/workflows/question-studio.yml']
  pull_request:
    paths: ['studio/**', 'scripts/build-question-studio.ps1', '.github/workflows/question-studio.yml']
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qt-labs-platform qml6-module-qtquick-templates qml6-module-qtqml-workerscript espeak-ng ffmpeg
      - name: Install Qt on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { throw 'aqt installation failed' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O qt --archives qtbase qtdeclarative qttools qtsvg
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE) { throw 'FFmpeg installation failed' }
          }
      - name: Configure and test Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S studio -B build-studio/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-studio/linux --parallel 4
          ctest --test-dir build-studio/linux --output-on-failure
      - name: Configure and test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}/qt/6.8.3/msvc2022_64/bin;$env:PATH"
          cmake -S studio -B build-studio/windows -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/qt/6.8.3/msvc2022_64"
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build-studio/windows --config Release --parallel 4
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build-studio/windows -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Tests failed' }
