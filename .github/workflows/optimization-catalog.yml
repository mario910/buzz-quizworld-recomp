name: Optimization catalog
on:
  push:
    branches: [main]
    paths: ['docs/optimization-status.md', 'tools/document-optimizations.py', 'port/CMakeLists.txt', 'port/runtime_defaults.inc', 'cmake/**', 'android/app/build.gradle', 'android/profiles/**', '.github/workflows/optimization-catalog.yml']
  pull_request:
    paths: ['docs/optimization-status.md', 'tools/document-optimizations.py', 'port/CMakeLists.txt', 'port/runtime_defaults.inc', 'cmake/**', 'android/app/build.gradle', 'android/profiles/**', '.github/workflows/optimization-catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tools/document-optimizations.py --check
