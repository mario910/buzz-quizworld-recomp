name: PC port host tests
on:
  push:
    branches: [main]
    paths: ['port/**', 'tests/**', 'cmake/BuzzPhone.cmake', 'ps3recomp', '.gitmodules', '.github/workflows/port-tests.yml']
  pull_request:
    paths: ['port/**', 'tests/**', 'cmake/BuzzPhone.cmake', 'ps3recomp', '.gitmodules', '.github/workflows/port-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.platform }} (synthetic host tests)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      # Match the game's Windows toolchain.
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S tests -B build-ci/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Configure Linux/macOS
        if: runner.os != 'Windows'
        run: cmake -S tests -B build-ci/tests -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ci/tests --parallel 3
      - name: Test (no game files, firmware, controllers or desktop input)
        run: ctest --test-dir build-ci/tests --output-on-failure --timeout 60
