name: Native preparation
on:
  push:
    branches: [main]
    paths: ['preparation/**', 'third_party/zlib', 'ps3recomp', '.gitmodules', 'cmake/BuzzLinuxVulkan.*', 'scripts/build-preparation.ps1', 'scripts/build-preparation-linux.sh', '.github/workflows/native-preparation.yml']
  pull_request:
    paths: ['preparation/**', 'third_party/zlib', 'ps3recomp', '.gitmodules', 'cmake/BuzzLinuxVulkan.*', 'scripts/build-preparation.ps1', 'scripts/build-preparation-linux.sh', '.github/workflows/native-preparation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libssl-dev libgl1-mesa-dev libopengl-dev
      - name: Install developer Qt on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { throw 'aqt failed' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O qt --archives qtbase
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
      - name: Build and test Linux
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-preparation-linux.sh
          patch --dry-run --batch ps3recomp/libs/video/rsx_vulkan_backend.c cmake/BuzzLinuxVulkan.patch
          tar -C dist-preparation/linux -czf BuzzPrepare-linux-x64.tar.gz bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: BuzzPrepare-${{ matrix.os }}-x64
          path: BuzzPrepare-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Build, test and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-preparation.ps1 -QtPrefix "${{ github.workspace }}/qt/6.8.3/msvc2022_64" -Jobs 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Windows'
        with:
          name: BuzzPrepare-windows-x64
          path: dist-preparation/
          if-no-files-found: error
          retention-days: 14
