name: Native preparation
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['preparation/**', 'third_party/zlib', 'ps3recomp', '.gitmodules', 'cmake/BuzzLinuxVulkan.*', 'Prepare-Buzz.cmd', 'scripts/build-preparation.ps1', 'scripts/build-preparation-linux.sh', 'launcher/setup_pipeline.py', 'tools/package-preparation.py', '.github/workflows/native-preparation.yml']
  pull_request:
    paths: ['preparation/**', 'third_party/zlib', 'ps3recomp', '.gitmodules', 'cmake/BuzzLinuxVulkan.*', 'Prepare-Buzz.cmd', 'scripts/build-preparation.ps1', 'scripts/build-preparation-linux.sh', 'launcher/setup_pipeline.py', 'tools/package-preparation.py', '.github/workflows/native-preparation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libssl-dev libgl1-mesa-dev libopengl-dev
      - name: Install developer Qt on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { throw 'aqt failed' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O qt --archives qtbase
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
      - name: Build and test Linux
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-preparation-linux.sh
          patch --dry-run --batch ps3recomp/libs/video/rsx_vulkan_backend.c cmake/BuzzLinuxVulkan.patch
          tar -C dist-preparation/linux -czf BuzzPrepare-linux-x64.tar.gz bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: BuzzPrepare-${{ matrix.os }}-x64
          path: BuzzPrepare-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Build, test and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-preparation.ps1 -QtPrefix "$env:GITHUB_WORKSPACE/qt/6.8.3/msvc2022_64" -Jobs 4
          $output = New-Item -ItemType Directory -Path dist-preparation/release
          $qtSource = Join-Path $output.FullName 'qtbase-everywhere-src-6.8.3.tar.xz'
          curl.exe --fail --location --retry 3 --output $qtSource "https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz"
          if ($LASTEXITCODE) { throw 'Qt source download failed' }
          python tools/package-preparation.py --qt-source $qtSource --output $output.FullName
          if ($LASTEXITCODE) { throw 'Windows package failed' }
      - name: Test the extracted Windows package without Git or Qt on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $fixture = "$env:GITHUB_WORKSPACE/preparation/tests/fixtures/iso-0-0.fixture"
          Expand-Archive -LiteralPath dist-preparation/release/BuzzPrepare-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/prepare-smoke"
          Set-Location -LiteralPath "$env:RUNNER_TEMP/prepare-smoke/BuzzPrepare"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from launcher.setup_pipeline import copy_sources; scratch = TemporaryDirectory(); copy_sources(Path.cwd(), Path(scratch.name)); scratch.cleanup()"
          if ($LASTEXITCODE) { throw 'Packaged source snapshot failed' }
          & ./dist-preparation/bin/BuzzPrepare.exe --inspect-iso $fixture
          if ($LASTEXITCODE) { throw 'Packaged executable failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Windows'
        with:
          name: BuzzPrepare-windows-x64
          path: dist-preparation/release/
          if-no-files-found: error
          retention-days: 14
  release-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: BuzzPrepare-windows-x64
          path: assets
      - name: Publish Windows preparation release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes 'Download BuzzPrepare-windows-x64.zip, extract it, and run Prepare-Buzz.cmd. The wizard prepares a private playable copy from your own game and firmware. The Qt source archive is provided for the bundled Qt libraries.' \
            BuzzPrepare-windows-x64.zip SHA256SUMS.txt qtbase-everywhere-src-6.8.3.tar.xz
