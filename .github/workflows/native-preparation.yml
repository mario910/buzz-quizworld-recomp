name: Native preparation
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['preparation/**', 'third_party/zlib', 'ps3recomp', '.gitmodules', 'cmake/**', 'port/**', 'scripts/Build-Buzz.ps1', 'scripts/build-windows.ps1', 'tools/desktop_adapters.py', 'tests/windows-game-build.py', 'Prepare-Buzz.cmd', 'scripts/build-preparation.ps1', 'scripts/build-preparation-linux.sh', 'launcher/setup_pipeline.py', 'tools/package-preparation.py', 'tools/package-preparation-linux.py', 'scripts/linux-build-container.sh', 'launcher/native/**', 'Prepare-Buzz.sh', 'Launch-Buzz.sh', '.github/workflows/native-preparation.yml']
  pull_request:
    paths: ['preparation/**', 'third_party/zlib', 'ps3recomp', '.gitmodules', 'cmake/**', 'port/**', 'scripts/Build-Buzz.ps1', 'scripts/build-windows.ps1', 'tools/desktop_adapters.py', 'tests/windows-game-build.py', 'Prepare-Buzz.cmd', 'scripts/build-preparation.ps1', 'scripts/build-preparation-linux.sh', 'launcher/setup_pipeline.py', 'tools/package-preparation.py', 'tools/package-preparation-linux.py', 'scripts/linux-build-container.sh', 'launcher/native/**', 'Prepare-Buzz.sh', 'Launch-Buzz.sh', '.github/workflows/native-preparation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          persist-credentials: false
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libssl-dev libgl1-mesa-dev libopengl-dev patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev xvfb
      - name: Install developer Qt on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { throw 'aqt failed' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O qt --archives qtbase
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
      - name: Build and test Linux
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-preparation-linux.sh
          patch --dry-run --batch ps3recomp/libs/video/rsx_vulkan_backend.c cmake/BuzzLinuxVulkan.patch
          tar -C dist-preparation/linux -czf BuzzPrepare-linux-x64.tar.gz bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: BuzzPrepare-${{ matrix.os }}-x64
          path: BuzzPrepare-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
      # The downloadable Linux package: BuzzSetup with bundled Qt, the native
      # launcher and the pinned build sources (glibc 2.39+: built on 24.04).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.os == 'ubuntu-24.04'
        with:
          python-version: '3.12'
      - name: Package the Linux release
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python -m pip install cmake==3.31.10 ninja==1.13.0
          bash scripts/build-launcher-linux.sh 4
          tools="$RUNNER_TEMP/appimage"; mkdir -p "$tools"
          curl --fail --location --retry 3 -o "$tools/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 -o "$tools/runtime-x86_64" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s\n' 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' \
            '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64' > "$tools/SHA256SUMS"
          (cd "$tools" && sha256sum --check SHA256SUMS)
          chmod +x "$tools/appimagetool"
          python tools/package-preparation-linux.py --launcher build-launcher/BuzzLauncher --output dist-preparation/release-linux \
            --appimage-tool "$tools/appimagetool" --appimage-runtime "$tools/runtime-x86_64"
      - name: Test the extracted Linux package
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p "$RUNNER_TEMP/linux-smoke"
          tar -xzf dist-preparation/release-linux/BuzzPrepare-linux-x86_64.tar.gz -C "$RUNNER_TEMP/linux-smoke"
          package="$RUNNER_TEMP/linux-smoke/BuzzPrepare"
          env -i PATH=/usr/bin:/bin "$package/bin/BuzzPrepare" --inspect-iso preparation/tests/fixtures/iso-0-0.fixture
          # Headless: SDL needs its dummy video and software render drivers here.
          env -i PATH=/usr/bin:/bin SDL_VIDEO_DRIVER=dummy SDL_RENDER_DRIVER=software \
            "$package/bin/BuzzLauncher" --project "$package/build-files" --smoke
          (cd "$package/build-files" && python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from launcher.setup_pipeline import copy_sources; scratch = TemporaryDirectory(); copy_sources(Path.cwd(), Path(scratch.name)); scratch.cleanup()")
          xvfb-run -a timeout 10 "$package/BuzzSetup" || test $? -eq 124
          image="$PWD/dist-preparation/release-linux/BuzzSetup-x86_64.AppImage"
          export BUZZ_HOME="$RUNNER_TEMP/appimage-home" APPIMAGE_EXTRACT_AND_RUN=1
          SDL_VIDEO_DRIVER=dummy SDL_RENDER_DRIVER=software "$image" --launcher --smoke
          test -f "$BUZZ_HOME/build-files/release-sources.json"
          test -x "$BUZZ_HOME/build-files/scripts/linux-build-container.sh"
          xvfb-run -a timeout 10 "$image" || test $? -eq 124
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: BuzzPrepare-linux-x86_64
          path: dist-preparation/release-linux/
          if-no-files-found: error
          retention-days: 14
      - name: Build, test and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-preparation.ps1 -QtPrefix "$env:GITHUB_WORKSPACE/qt/6.8.3/msvc2022_64" -Jobs 4
          $output = New-Item -ItemType Directory -Path dist-preparation/release
          $qtSource = Join-Path $output.FullName 'qtbase-everywhere-src-6.8.3.tar.xz'
          curl.exe --fail --location --retry 3 --output $qtSource "https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz"
          if ($LASTEXITCODE) { throw 'Qt source download failed' }
          python tools/package-preparation.py --qt-source $qtSource --output $output.FullName
          if ($LASTEXITCODE) { throw 'Windows package failed' }
      - name: Test the extracted Windows package without Git or Qt on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $fixture = "$env:GITHUB_WORKSPACE/preparation/tests/fixtures/iso-0-0.fixture"
          Expand-Archive -LiteralPath dist-preparation/release/BuzzPrepare-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP/prepare-smoke"
          $package = "$env:RUNNER_TEMP/prepare-smoke/BuzzPrepare"
          Set-Location -LiteralPath "$package/build-files"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from launcher.setup_pipeline import copy_sources; scratch = TemporaryDirectory(); copy_sources(Path.cwd(), Path(scratch.name)); scratch.cleanup()"
          if ($LASTEXITCODE) { throw 'Packaged source snapshot failed' }
          & "$env:GITHUB_WORKSPACE/dist-preparation/bin/BuzzPrepare.exe" --inspect-iso $fixture
          if ($LASTEXITCODE) { throw 'Native preparation CLI failed' }
          $gui = Start-Process -FilePath "$package/BuzzSetup.exe" -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
          try {
            if (-not $gui.WaitForInputIdle(15000) -or $gui.HasExited) { throw 'BuzzSetup did not open' }
          } finally {
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id }
          }
      - name: Configure Windows game compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build and start the Windows Vulkan game host from the release ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install cmake==3.31.10 ninja==1.13.0
          if ($LASTEXITCODE) { throw 'Game build tools installation failed' }
          python tests/windows-game-build.py "$env:RUNNER_TEMP/prepare-smoke/BuzzPrepare/build-files" "$env:RUNNER_TEMP/game"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Windows'
        with:
          name: BuzzPrepare-windows-x64
          path: dist-preparation/release/
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: BuzzPrepare-windows-x64
          path: assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: BuzzPrepare-linux-x86_64
          path: assets
      - name: Publish Windows preparation release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS.txt SHA256SUMS-linux.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "BuzzSetup $TAG" \
            --notes 'Download **BuzzPrepare-windows-x64.zip**, extract the entire ZIP to a writable folder, and open **BuzzSetup.exe**. Choose your Buzz! Quiz World disc or ISO and PS3 firmware. Use the firmware and key file buttons or select your own files. If Windows build tools are missing, the app will show installation options. Select **Prepare game**, then **Play Buzz!**. The Qt source archive accompanies the bundled Qt libraries. **Linux / Steam Deck:** download **BuzzSetup-x86_64.AppImage**, make it executable and run it (or use **BuzzPrepare-linux-x86_64.tar.gz** and its **BuzzSetup**). The game is prepared in ~/BuzzQuizWorld; on SteamOS and other image-based systems BuzzSetup builds inside a distrobox container without changing the system. Start the prepared game with **BuzzSetup-x86_64.AppImage --play** (also the Steam launch option).' \
            BuzzPrepare-windows-x64.zip SHA256SUMS.txt qtbase-everywhere-src-6.8.3.tar.xz \
            BuzzSetup-x86_64.AppImage BuzzPrepare-linux-x86_64.tar.gz SHA256SUMS-linux.txt
