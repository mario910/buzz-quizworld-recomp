# Runtime prototype: copy only to the selected build's runtime/pc-settings.ini.
# File is read once at startup; future in-game UI uses the live API, not polling.
# Version 1 files (without the display keys below) remain valid.
version=2
volume=100
fps_limit=30
# 1: borderless fullscreen at the desktop resolution of the window's monitor.
fullscreen=0
offline=1
renderer=auto
# Display: windowed client size in physical pixels, 640x360 to 7680x7680.
# 0x0 keeps the default (1280x720). Applied live; shrunk to fit the screen.
window_width=0
window_height=0
# Internal rendering resolution in percent of 1280x720: 100, 150 (1080p),
# 200 (1440p) or 300 (2160p); any value 100-300 is accepted. Restart-only.
render_scale=100
# Scaling of the finished frame into the window: bilinear or fsr1 (AMD FSR 1:
# edge-adaptive upscale + sharpening, used when the window is larger than the
# internal resolution). fsr_sharpness 0-100. Both apply live.
upscale_filter=bilinear
fsr_sharpness=80
# Texture packs in the game folder's textures/: PNGs in replace/ are used in
# place of the game's textures with the same name (any size); texture_dump=1
# writes every new texture to dump/ for making packs. Restart-only.
texture_replace=1
texture_dump=0
# Dump, upscale each new texture 4x with Real-ESRGAN in the background
# (textures/upscaler/realesrgan-ncnn-vulkan[.exe] plus its models/) into
# replace/auto, and use the results while playing. Restart-only.
texture_auto_upscale=0
# Optional local HTTP controller host. Does not enable PSN/Internet play.
phone_buzzers=0
phone_port=8073
