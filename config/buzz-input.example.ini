# Opt in with an ABSOLUTE path in BUZZ_INPUT_CONFIG. This file is not auto-loaded.
# Every mapping uses RED, YELLOW, GREEN, ORANGE, BLUE order (not screen order).
players=4
pulse_ms=250
keyboard.1=Space,4,3,2,1
keyboard.2=Q,W,E,R,T
keyboard.3=A,S,D,F,G
keyboard.4=Z,X,C,V,B
# For eight players: players=8 exposes a second USB receiver. P5-P8 have no
# default keyboard keys. Configure them explicitly; game mode limits still apply.
# keyboard.5=F1,F2,F3,F4,F5
# keyboard.6=F6,F7,F8,F9,F10
# keyboard.7=F11,F12,0x60,0x61,0x62
# keyboard.8=0x63,0x64,0x65,0x66,0x67

# Optional Xbox-compatible controllers (XInput: up to FOUR physical pads).
gamepads=1
background_gamepads=0
# gamepad.N is XInput slot N-1; first value is logical player 1..8.
# R1/RB = red. D-pad Up/Right/Down/Left = blue/orange/green/yellow.
# START is not a buzzer button in this preset; it is reserved for the PC menu.
gamepad.1=1,RB,LEFT,DOWN,RIGHT,UP
gamepad.2=2,RB,LEFT,DOWN,RIGHT,UP
gamepad.3=3,RB,LEFT,DOWN,RIGHT,UP
gamepad.4=4,RB,LEFT,DOWN,RIGHT,UP
